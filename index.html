  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }

    display:flex; flex-direction:column; background:#fcfdfa; overflow:hidden;

  }

  .inputbox {

    border:2px solid #1a6b7a; background:#fff;
    display:flex; align-items:center; font-size:28px; font-weight:700; color:#111;
    overflow-x:auto; white-space:nowrap;
  }

    width:72px; margin:12px 12px 12px 0; border:none; cursor:pointer;
    background:#f5b971; font-size:30px; font-weight:700; color:#5a3d13;
  }

  .canvas {
    flex:1; overflow:auto; padding:14px;
    background-color:#fcfdfa;

      linear-gradient(#d5e5e5 1px, transparent 1px),
      linear-gradient(90deg, #d5e5e5 1px, transparent 1px);
    background-size:56px 56px;
  }
  #expr { font-size:36px; font-weight:700; color:#111; min-height:70px; }
  #result { margin-top:16px; font-size:38px; color:#1a6b7a; font-weight:700; }

  .toggles { display:flex; justify-content:flex-end; gap:10px; padding:10px 14px; background:#eef4f2; }
  .chip { border:2px solid #aaa; padding:6px 14px; font-weight:700; font-size:16px; cursor:pointer; background:#fff; color:#777; }
  .chip.active { color:#1a6b7a; border-color:#1a6b7a; }

  .keypad { display:grid; gap:2px; background:#ccc; height:45vh; min-height:260px;
            grid-template-columns:repeat(9, 1fr); grid-template-rows:repeat(4, 1fr); }
  .key { border:none; font-size:24px; font-weight:600; cursor:pointer; color:#222; }
  .key:active { filter:brightness(0.88); }
  .blue   { background:#9fd4f0; }
  .teal   { background:#7fd0c8; }
  .gray   { background:#c9c9c7; }
  .orange { background:#f5b971; }
  .digit  { background:#f0f0ee; font-size:30px; font-weight:700; color:#111; }
</style>
</head>
<body>

<div class="topbar">
  <div class="inputbox" id="display"></div>
  <button class="clearbtn" onclick="clearAll()">C</button>
</div>

<div class="canvas">
  <div id="expr"></div>
  <div id="result"></div>
</div>

<div class="toggles">
  <div class="chip active" id="chip-digits"  onclick="setMode('digits')">0-9</div>
  <div class="chip" id="chip-letters" onclick="setMode('letters')">a-z</div>
  <div class="chip" id="chip-greek"   onclick="setMode('greek')">α-ω</div>
</div>

<div class="keypad" id="keypad"></div>

<script>
/* ===== Calculator logic ===== */
let tokens = [];
let mode = 'digits';
let upper = false;
let page = 0;

const pages = {
  digits: [
    ['7','8','9','4','5','6','1','2','3']
  ],
  letters: [
    ['a','b','c','d','e','f','g','h','i'],
    ['j','k','l','m','n','o','p','q','r'],
    ['s','t','u','v','w','x','y','z','␣']
  ],
  greek: [
    ['α','β','γ','δ','ε','ζ','η','θ','ι'],
    ['κ','λ','μ','ν','ξ','ο','π','ρ','σ'],
    ['τ','υ','φ','χ','ψ','ω','␣','','']
  ]
};

const keypad = document.getElementById('keypad');

function setMode(m) {
  mode = m; page = 0;
  document.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('active'); });
  document.getElementById('chip-' + m).classList.add('active');
  buildPad();
}

function caseOf(ch) {
  if (/[a-z]/.test(ch) && upper) return ch.toUpperCase();
  return ch;
}

function topRow() {
  addKey('%', '%', 'blue');
  addKey('n!', '!', 'blue');
  addKey('|x|', '|', 'blue');
  addKey('xʸ', '^', 'blue');
  addKey('√', '√', 'blue');
  addKey('÷', '/', 'gray');
  addKey('×', '*', 'gray');
  addKey('−', '-', 'gray');
  addKey('+', '+', 'gray');
}

function buildPad() {
  keypad.innerHTML = '';
  topRow();

  if (mode === 'digits') {
    pages.digits[0].forEach(function(k){ addKey(k, k, 'digit'); });
    addKey('(', '(', 'gray');
    addKey('0', '0', 'digit');
    addKey(')', ')', 'gray');
    addKey('.', '.', 'digit');
    addKey('⌫', null, 'orange');
    addKey('=', null, 'blue', true);
  } else {
    const pg = pages[mode][page];
    pg.forEach(function(k){
      if (k === '') { addKey('', null, 'digit'); }
      else if (k === '␣') { addKey('␣', ' ', 'digit'); }
      else { addKey(caseOf(k), caseOf(k), 'digit'); }
    });
    if (mode === 'letters') addKey(upper ? 'A↕' : 'a↕', null, 'teal');
    else addKey('·', null, 'digit');
    if (page > 0) addKey('←', null, 'teal'); else addKey('·', null, 'digit');
    if (page < pages[mode].length - 1) addKey('→', null, 'teal'); else addKey('·', null, 'digit');
    addKey((page + 1) + '/' + pages[mode].length, null, 'digit');
    addKey('⌫', null, 'orange');
    addKey('.', '.', 'digit');
    addKey('=', null, 'blue', true);
  }
}

function addKey(label, value, cls, wide) {
  const b = document.createElement('button');
  b.className = 'key ' + cls;
  b.textContent = label;
  if (label === '⌫') {
    b.onclick = backspace;
  } else if (label === '=') {
    if (wide) b.style.gridColumn = 'span 2';
    b.onclick = evalExpr;
  } else if (label === 'a↕' || label === 'A↕') {
    b.onclick = function(){ upper = !upper; buildPad(); };
  } else if (label === '←') {
    b.onclick = function(){ if (page > 0) { page--; buildPad(); } };
  } else if (label === '→') {
    b.onclick = function(){ if (page < pages[mode].length - 1) { page++; buildPad(); } };
  } else if (value !== null && label !== '') {
    b.onclick = function(){ ins(value); };
  }
  keypad.appendChild(b);
}

function fracHTML(a, b) {
  return '<span style="display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 3px">' +
         '<span style="border-bottom:2px solid #111;padding:0 4px">' + a + '</span>' +
         '<span style="padding:0 4px">' + b + '</span></span>';
}
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function render() {
  let out = '';
  for (let i = 0; i < tokens.length; i++) {
    if (tokens[i] === '/' && i > 0 && i < tokens.length - 1 &&
        /[0-9]/.test(tokens[i-1]) && /[0-9]/.test(tokens[i+1])) {
      out += fracHTML(esc(tokens[i-1]), esc(tokens[i+1]));
      i++;
    } else if (tokens[i] === '*') out += ' × ';
    else if (tokens[i] === '-') out += ' − ';
    else out += esc(tokens[i]);
  }
  document.getElementById('display').textContent = tokens.join(' ');
  document.getElementById('expr').innerHTML = out || '&nbsp;';
}

function ins(t){ tokens.push(t); render(); }
function backspace(){ tokens.pop(); render(); }
function clearAll(){
  tokens = []; upper = false; page = 0;
  document.getElementById('result').textContent = '';
  render(); buildPad();
}

function gcd(a, b){ return b ? gcd(b, a % b) : Math.abs(a); }

function evalExpr() {
  try {
    const src = tokens.filter(function(t){
      return !/^[a-zA-Zα-ωΑ-Ω]$/.test(t) && t !== ' ';
    }).join('');
    if (!src) { document.getElementById('result').textContent = '= 0'; return; }
    const val = Function('"use strict";return (' + src + ')')();
    let text;
    if (Number.isInteger(val)) {
      text = String(val);
    } else {
      const s = String(val);
      const m = s.match(/^(-?\d+)\.(\d+)$/);
      if (m) {
        const num = parseInt(m[1] + m[2]);
        const den = Math.pow(10, m[2].length);
        const g = gcd(num, den);
        text = (num/g) + '/' + (den/g) + '  (≈ ' + val.toFixed(4) + ')';
      } else {
        text = val.toFixed(6);
      }
    }
    document.getElementById('result').textContent = '= ' + text;
  } catch (e) {
    document.getElementById('result').textContent = 'error';
  }
}

buildPad();
render();
