*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;width:100%}
body{display:flex;flex-direction:column;background:#fcfdfa;overflow:hidden;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

/* Top nav modes */
.modes{display:flex;overflow-x:auto;background:#1a6b7a;padding:6px 8px;gap:6px;flex-shrink:0;
  -webkit-overflow-scrolling:touch}
.mode-btn{flex-shrink:0;border:none;background:rgba(255,255,255,.15);color:#fff;padding:8px 14px;
  border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.mode-btn.active{background:#fff;color:#1a6b7a}

/* Calculator panel */
.panel{display:none;flex:1;flex-direction:column;min-height:0;overflow:hidden}
.panel.active{display:flex}

.topbar{display:flex;height:56px;flex-shrink:0}
.inputbox{flex:1;margin:8px 0 8px 10px;padding:0 12px;border:2px solid #1a6b7a;background:#fff;
  display:flex;align-items:center;font-size:22px;font-weight:700;color:#111;overflow-x:auto;white-space:nowrap}
.clearbtn{width:64px;margin:8px 10px 8px 0;border:none;cursor:pointer;background:#f5b971;
  font-size:26px;font-weight:700;color:#5a3d13;border-radius:4px}

.canvas{flex:1;overflow:auto;padding:10px 12px;background-color:#fcfdfa;
  background-image:linear-gradient(#d5e5e5 1px,transparent 1px),linear-gradient(90deg,#d5e5e5 1px,transparent 1px);
  background-size:48px 48px;min-height:0}
#expr{font-size:28px;font-weight:700;color:#111;min-height:40px;word-break:break-all}
#result{margin-top:10px;font-size:30px;color:#1a6b7a;font-weight:700}
.history-list{margin-top:12px;font-size:14px;color:#555}
.history-list div{padding:4px 0;border-bottom:1px solid #e0e8e8}

.mem-row{display:flex;gap:4px;padding:4px 10px;background:#eef4f2;flex-shrink:0}
.mem-btn{flex:1;border:1px solid #aaa;background:#fff;padding:6px;font-size:13px;font-weight:700;
  cursor:pointer;color:#1a6b7a;border-radius:4px}
.mem-btn:active{background:#d0e8e8}

.toggles{display:flex;justify-content:flex-end;gap:8px;padding:6px 10px;background:#eef4f2;flex-shrink:0}
.chip{border:2px solid #aaa;padding:5px 12px;font-weight:700;font-size:14px;cursor:pointer;background:#fff;color:#777;border-radius:4px}
.chip.active{color:#1a6b7a;border-color:#1a6b7a}

.keypad{display:grid;gap:2px;background:#ccc;height:42vh;min-height:220px;flex-shrink:0;
  grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(5,1fr)}
.key{border:none;font-size:18px;font-weight:600;cursor:pointer;color:#222}
.key:active{filter:brightness(.88)}
.blue{background:#9fd4f0}.teal{background:#7fd0c8}.gray{background:#c9c9c7}
.orange{background:#f5b971}.digit{background:#f0f0ee;font-size:24px;font-weight:700;color:#111}
.sci{background:#b8d4e8;font-size:14px;font-weight:700}

/* Converter panels */
.conv-body{flex:1;overflow:auto;padding:14px;min-height:0}
.conv-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.conv-row input{flex:1;padding:12px;font-size:20px;font-weight:700;border:2px solid #1a6b7a;border-radius:6px}
.conv-row select{padding:12px 8px;font-size:15px;font-weight:600;border:2px solid #aaa;border-radius:6px;max-width:140px}
.conv-title{font-size:18px;font-weight:700;color:#1a6b7a;margin:16px 0 10px}
.cat-btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.cat-btn{border:2px solid #aaa;background:#fff;padding:8px 12px;font-weight:700;font-size:13px;
  cursor:pointer;border-radius:16px;color:#555}
.cat-btn.active{border-color:#1a6b7a;color:#1a6b7a;background:#e8f4f4}
.swap-btn{width:100%;padding:10px;margin:8px 0;border:none;background:#1a6b7a;color:#fff;
  font-size:16px;font-weight:700;border-radius:8px;cursor:pointer}

/* Finance / Math forms */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:700;color:#555;margin-bottom:4px}
.form-group input,.form-group select{width:100%;padding:12px;font-size:18px;font-weight:600;
  border:2px solid #1a6b7a;border-radius:6px}
.calc-btn{width:100%;padding:14px;border:none;background:#1a6b7a;color:#fff;font-size:18px;
  font-weight:700;border-radius:8px;cursor:pointer;margin-top:8px}
.calc-btn:active{filter:brightness(.9)}
.out-box{margin-top:16px;padding:14px;background:#e8f4f4;border-radius:8px;font-size:18px;font-weight:700;color:#1a6b7a}
.out-box .sub{font-size:14px;font-weight:500;color:#555;margin-top:6px}

.tab-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab-btn{border:2px solid #aaa;background:#fff;padding:8px 14px;font-weight:700;font-size:13px;
  cursor:pointer;border-radius:16px;color:#555}
.tab-btn.active{border-color:#1a6b7a;color:#1a6b7a;background:#e8f4f4}
.pick-btn{min-width:130px;padding:12px 10px;font-size:15px;font-weight:700;border:2px solid #1a6b7a;
  background:#fff;border-radius:6px;cursor:pointer;color:#1a6b7a;text-align:left;line-height:1.25}
.pick-btn small{display:block;font-size:11px;font-weight:500;color:#888;margin-top:2px}
.picker-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;
  align-items:flex-end;justify-content:center}
.picker-overlay.show{display:flex}
.picker-sheet{background:#fff;width:100%;max-width:480px;max-height:75vh;border-radius:16px 16px 0 0;
  display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.picker-head{padding:14px 16px 8px;border-bottom:1px solid #e0e8e8}
.picker-head input{width:100%;padding:12px;font-size:16px;border:2px solid #1a6b7a;border-radius:8px;font-weight:600}
.picker-list{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.picker-item{padding:14px 16px;border-bottom:1px solid #f0f0f0;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.picker-item:active,.picker-item.selected{background:#e8f4f4}
.picker-item .code{font-weight:700;font-size:16px;color:#1a6b7a}
.picker-item .name{font-size:13px;color:#666}
.picker-close{padding:12px;text-align:center;font-weight:700;color:#1a6b7a;border-top:1px solid #e0e8e8;cursor:pointer}
</style>
</head>
<body>

<div class="modes" id="modeBar">
  <button class="mode-btn active" data-mode="calc">Calculator</button>
  <button class="mode-btn" data-mode="unit">Units</button>
  <button class="mode-btn" data-mode="currency">Currency</button>
  <button class="mode-btn" data-mode="finance">Finance</button>
  <button class="mode-btn" data-mode="math">Math Tools</button>
</div>

<!-- ========== CALCULATOR ========== -->
<div class="panel active" id="panel-calc">
  <div class="topbar">
    <div class="inputbox" id="display"></div>
    <button class="clearbtn" id="clearBtn">C</button>
  </div>
  <div class="mem-row">
    <button class="mem-btn" id="mcBtn">MC</button>
    <button class="mem-btn" id="mrBtn">MR</button>
    <button class="mem-btn" id="mplusBtn">M+</button>
    <button class="mem-btn" id="mminusBtn">M−</button>
    <button class="mem-btn" id="msBtn">MS</button>
  </div>
  <div class="canvas">
    <div id="expr"></div>
    <div id="result"></div>
    <div class="history-list" id="histList"></div>
  </div>
  <div class="toggles">
    <div class="chip active" id="chip-digits" data-kb="digits">0-9</div>
    <div class="chip" id="chip-sci" data-kb="sci">Sci</div>
    <div class="chip" id="chip-letters" data-kb="letters">a-z</div>
    <div class="chip" id="chip-greek" data-kb="greek">α-ω</div>
  </div>
  <div class="keypad" id="keypad"></div>
</div>

<!-- ========== UNIT CONVERTER ========== -->
<div class="panel" id="panel-unit">
  <div class="conv-body">
    <div class="cat-btns" id="unitCats"></div>
    <div class="conv-row">
      <input type="number" id="unitFromVal" value="1" inputmode="decimal">
      <select id="unitFrom"></select>
    </div>
    <button class="swap-btn" id="unitSwap">⇅ Swap</button>
    <div class="conv-row">
      <input type="number" id="unitToVal" readonly>
      <select id="unitTo"></select>
    </div>
    <div class="out-box" id="unitOut" style="display:none"></div>
  </div>
</div>

<!-- ========== CURRENCY ========== -->
<div class="panel" id="panel-currency">
  <div class="conv-body">
    <p style="font-size:13px;color:#888;margin-bottom:8px" id="curStatus">Offline rates (USD base). Tap Refresh for live rates.</p>
    <div class="form-group" style="margin-bottom:10px">
      <input type="search" id="curMainSearch" placeholder="🔍 Search currency code or name…" autocomplete="off"
        style="width:100%;padding:12px 14px;font-size:16px;font-weight:600;border:2px solid #1a6b7a;border-radius:8px">
    </div>
    <div class="cat-btns" id="curQuick" style="margin-bottom:12px"></div>
    <div class="conv-row">
      <input type="number" id="curFromVal" value="100" inputmode="decimal">
      <button type="button" class="pick-btn" id="curFromBtn"><span id="curFromCode">🇺🇸 USD ($)</span><small id="curFromName">US Dollar</small></button>
    </div>
    <button class="swap-btn" id="curSwap">⇅ Swap</button>
    <div class="conv-row">
      <input type="number" id="curToVal" readonly>
      <button type="button" class="pick-btn" id="curToBtn"><span id="curToCode">🇪🇺 EUR (€)</span><small id="curToName">Euro</small></button>
    </div>
    <div class="out-box" id="curOut"></div>
    <button class="calc-btn" id="curRefresh" style="margin-top:12px;background:#4ab0a0">↻ Refresh live rates</button>
    <div class="conv-title">Convert to multiple</div>
    <div id="curMulti" style="font-size:15px;line-height:1.8"></div>
  </div>
</div>
<div class="picker-overlay" id="curPicker">
  <div class="picker-sheet">
    <div class="picker-head">
      <input type="search" id="curSearch" placeholder="🔍 Type code or name (KES, euro, shilling)…" autocomplete="off">
    </div>
    <div class="picker-list" id="curPickerList"></div>
    <div class="picker-close" id="curPickerClose">Close</div>
  </div>
</div>

<!-- ========== FINANCE ========== -->
<div class="panel" id="panel-finance">
  <div class="conv-body">
    <div class="tab-row" id="finTabs">
      <button class="tab-btn active" data-fin="tip">Tip / Tax</button>
      <button class="tab-btn" data-fin="loan">Loan</button>
      <button class="tab-btn" data-fin="compound">Compound</button>
      <button class="tab-btn" data-fin="savings">Savings</button>
      <button class="tab-btn" data-fin="discount">Discount</button>
      <button class="tab-btn" data-fin="vat">VAT / GST</button>
      <button class="tab-btn" data-fin="roi">ROI</button>
      <button class="tab-btn" data-fin="margin">Profit Margin</button>
      <button class="tab-btn" data-fin="pct">Percentage</button>
      <button class="tab-btn" data-fin="unitprice">Unit Price</button>
    </div>
    <div id="fin-tip">
      <div class="form-group"><label>Bill amount</label><input type="number" id="tipBill" value="50" inputmode="decimal"></div>
      <div class="form-group"><label>Tip %</label><input type="number" id="tipPct" value="15" inputmode="decimal"></div>
      <div class="form-group"><label>Tax %</label><input type="number" id="tipTax" value="0" inputmode="decimal"></div>
      <div class="form-group"><label>Split between (people)</label><input type="number" id="tipSplit" value="1" inputmode="numeric"></div>
      <button class="calc-btn" id="tipCalc">Calculate</button>
      <div class="out-box" id="tipOut"></div>
    </div>
    <div id="fin-loan" style="display:none">
      <div class="form-group"><label>Loan amount</label><input type="number" id="loanAmt" value="10000" inputmode="decimal"></div>
      <div class="form-group"><label>Annual interest rate %</label><input type="number" id="loanRate" value="5" inputmode="decimal"></div>
      <div class="form-group"><label>Years</label><input type="number" id="loanYears" value="5" inputmode="decimal"></div>
      <button class="calc-btn" id="loanCalc">Calculate</button>
      <div class="out-box" id="loanOut"></div>
    </div>
    <div id="fin-pct" style="display:none">
      <div class="form-group"><label>Value</label><input type="number" id="pctVal" value="200" inputmode="decimal"></div>
      <div class="form-group"><label>Percentage %</label><input type="number" id="pctPct" value="15" inputmode="decimal"></div>
      <button class="calc-btn" id="pctCalc">Calculate</button>
      <div class="out-box" id="pctOut"></div>
    </div>
    <div id="fin-unitprice" style="display:none">
      <div class="form-group"><label>Price</label><input type="number" id="upPrice" value="3.99" inputmode="decimal"></div>
      <div class="form-group"><label>Quantity / weight</label><input type="number" id="upQty" value="500" inputmode="decimal"></div>
      <div class="form-group"><label>Unit (e.g. g, ml, piece)</label><input type="text" id="upUnit" value="g"></div>
      <button class="calc-btn" id="upCalc">Price per unit</button>
      <div class="out-box" id="upOut"></div>
    </div>
    <div id="fin-compound" style="display:none">
      <div class="form-group"><label>Principal</label><input type="number" id="ciP" value="10000" inputmode="decimal"></div>
      <div class="form-group"><label>Annual rate %</label><input type="number" id="ciR" value="5" inputmode="decimal"></div>
      <div class="form-group"><label>Years</label><input type="number" id="ciT" value="10" inputmode="decimal"></div>
      <div class="form-group"><label>Compounds per year</label>
        <select id="ciN"><option value="1">Annually</option><option value="2">Semi-annually</option>
        <option value="4" selected>Quarterly</option><option value="12">Monthly</option><option value="365">Daily</option></select>
      </div>
      <button class="calc-btn" id="ciCalc">Calculate</button>
      <div class="out-box" id="ciOut"></div>
    </div>
    <div id="fin-savings" style="display:none">
      <div class="form-group"><label>Starting amount</label><input type="number" id="savP" value="1000" inputmode="decimal"></div>
      <div class="form-group"><label>Monthly deposit</label><input type="number" id="savM" value="200" inputmode="decimal"></div>
      <div class="form-group"><label>Annual rate %</label><input type="number" id="savR" value="4" inputmode="decimal"></div>
      <div class="form-group"><label>Years</label><input type="number" id="savT" value="10" inputmode="decimal"></div>
      <button class="calc-btn" id="savCalc">Calculate</button>
      <div class="out-box" id="savOut"></div>
    </div>
    <div id="fin-discount" style="display:none">
      <div class="form-group"><label>Original price</label><input type="number" id="discP" value="100" inputmode="decimal"></div>
      <div class="form-group"><label>Discount %</label><input type="number" id="discPct" value="20" inputmode="decimal"></div>
      <button class="calc-btn" id="discCalc">Calculate</button>
      <div class="out-box" id="discOut"></div>
    </div>
    <div id="fin-vat" style="display:none">
      <div class="form-group"><label>Amount</label><input type="number" id="vatAmt" value="100" inputmode="decimal"></div>
      <div class="form-group"><label>VAT / GST %</label><input type="number" id="vatPct" value="15" inputmode="decimal"></div>
      <div class="form-group"><label>Mode</label>
        <select id="vatMode"><option value="add">Add tax (net → gross)</option><option value="extract">Extract tax (gross → net)</option></select>
      </div>
      <button class="calc-btn" id="vatCalc">Calculate</button>
      <div class="out-box" id="vatOut"></div>
    </div>
    <div id="fin-roi" style="display:none">
      <div class="form-group"><label>Initial investment</label><input type="number" id="roiCost" value="5000" inputmode="decimal"></div>
      <div class="form-group"><label>Final / current value</label><input type="number" id="roiGain" value="7500" inputmode="decimal"></div>
      <button class="calc-btn" id="roiCalc">Calculate ROI</button>
      <div class="out-box" id="roiOut"></div>
    </div>
    <div id="fin-margin" style="display:none">
      <div class="form-group"><label>Cost</label><input type="number" id="marCost" value="40" inputmode="decimal"></div>
      <div class="form-group"><label>Selling price</label><input type="number" id="marPrice" value="60" inputmode="decimal"></div>
      <button class="calc-btn" id="marCalc">Calculate</button>
      <div class="out-box" id="marOut"></div>
    </div>
  </div>
</div>

<!-- ========== MATH TOOLS ========== -->
<div class="panel" id="panel-math">
  <div class="conv-body">
    <div class="tab-row" id="mathTabs">
      <button class="tab-btn active" data-math="quad">Quadratic</button>
      <button class="tab-btn" data-math="avg">Average</button>
      <button class="tab-btn" data-math="prop">Proportion</button>
      <button class="tab-btn" data-math="shapes">Area / Volume</button>
      <button class="tab-btn" data-math="date">Date / Age</button>
      <button class="tab-btn" data-math="bmi">BMI</button>
    </div>
    <div id="math-quad">
      <p style="margin-bottom:8px;font-weight:600">ax² + bx + c = 0</p>
      <div class="form-group"><label>a</label><input type="number" id="qa" value="1" inputmode="decimal"></div>
      <div class="form-group"><label>b</label><input type="number" id="qb" value="-5" inputmode="decimal"></div>
      <div class="form-group"><label>c</label><input type="number" id="qc" value="6" inputmode="decimal"></div>
      <button class="calc-btn" id="quadCalc">Solve</button>
      <div class="out-box" id="quadOut"></div>
    </div>
    <div id="math-avg" style="display:none">
      <div class="form-group"><label>Numbers (comma or space separated)</label>
        <input type="text" id="avgNums" value="10, 20, 30, 40"></div>
      <button class="calc-btn" id="avgCalc">Calculate</button>
      <div class="out-box" id="avgOut"></div>
    </div>
    <div id="math-prop" style="display:none">
      <p style="margin-bottom:8px;font-weight:600">a / b = c / d &nbsp;(leave one blank)</p>
      <div class="form-group"><label>a</label><input type="number" id="pa" value="2" inputmode="decimal"></div>
      <div class="form-group"><label>b</label><input type="number" id="pb" value="4" inputmode="decimal"></div>
      <div class="form-group"><label>c</label><input type="number" id="pc" value="5" inputmode="decimal"></div>
      <div class="form-group"><label>d</label><input type="number" id="pd" value="" placeholder="?" inputmode="decimal"></div>
      <button class="calc-btn" id="propCalc">Solve</button>
      <div class="out-box" id="propOut"></div>
    </div>
    <div id="math-shapes" style="display:none">
      <div class="form-group"><label>Shape</label>
        <select id="shapeType">
          <option value="rect">Rectangle (area)</option>
          <option value="circle">Circle (area)</option>
          <option value="tri">Triangle (area)</option>
          <option value="sphere">Sphere (volume)</option>
          <option value="cyl">Cylinder (volume)</option>
          <option value="box">Box (volume)</option>
        </select>
      </div>
      <div class="form-group" id="s1g"><label id="s1l">Length</label><input type="number" id="s1" value="5" inputmode="decimal"></div>
      <div class="form-group" id="s2g"><label id="s2l">Width</label><input type="number" id="s2" value="3" inputmode="decimal"></div>
      <div class="form-group" id="s3g" style="display:none"><label id="s3l">Height</label><input type="number" id="s3" value="2" inputmode="decimal"></div>
      <button class="calc-btn" id="shapeCalc">Calculate</button>
      <div class="out-box" id="shapeOut"></div>
    </div>
    <div id="math-date" style="display:none">
      <div class="form-group"><label>Date 1 (birth / start)</label><input type="date" id="d1"></div>
      <div class="form-group"><label>Date 2 (today / end)</label><input type="date" id="d2"></div>
      <button class="calc-btn" id="dateCalc">Calculate age / difference</button>
      <div class="out-box" id="dateOut"></div>
    </div>
    <div id="math-bmi" style="display:none">
      <div class="form-group"><label>Weight (kg)</label><input type="number" id="bmiW" value="70" inputmode="decimal"></div>
      <div class="form-group"><label>Height (cm)</label><input type="number" id="bmiH" value="175" inputmode="decimal"></div>
      <button class="calc-btn" id="bmiCalc">Calculate BMI</button>
      <div class="out-box" id="bmiOut"></div>
    </div>
  </div>
</div>

<script>
/* ========== ANTI-ZOOM ========== */
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=n},{passive:false});

/* ========== MODE SWITCH ========== */
document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('panel-'+btn.dataset.mode).classList.add('active');
  });
});

/* ========== CALCULATOR CORE ========== */
let tokens=[], kbMode='digits', upper=false, page=0, memory=0, history=[];
const pages={
  digits:[['7','8','9','4','5','6','1','2','3']],
  sci:[['sin','cos','tan','ln','log','π','e','(',')'],['asin','acos','atan','exp','10^','x²','x³','1/x','±']],
  letters:[['a','b','c','d','e','f','g','h','i'],['j','k','l','m','n','o','p','q','r'],['s','t','u','v','w','x','y','z','␣']],
  greek:[['α','β','γ','δ','ε','ζ','η','θ','ι'],['κ','λ','μ','ν','ξ','ο','π','ρ','σ'],['τ','υ','φ','χ','ψ','ω','␣','','']]
};
const keypad=document.getElementById('keypad');

function setKb(m){
  kbMode=m;page=0;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.kb===m));
  buildPad();
}
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>setKb(c.dataset.kb)));

function caseOf(ch){return (/[a-z]/.test(ch)&&upper)?ch.toUpperCase():ch}

function topRow(){
  [['%','%','blue'],['n!','!','blue'],['|x|','|','blue'],['xʸ','^','blue'],['√','√','blue'],
   ['÷','/','gray'],['×','*','gray'],['−','-','gray'],['+','+','gray']].forEach(([l,v,c])=>addKey(l,v,c));
}

function buildPad(){
  keypad.innerHTML='';
  if(kbMode==='sci'){
    keypad.style.gridTemplateRows='repeat(4,1fr)';
    pages.sci.forEach(row=>row.forEach(k=>addKey(k,k,'sci')));
    addKey('⌫',null,'orange');addKey('=',null,'blue',true);
    // fill rest
    for(let i=0;i<7;i++) addKey('',null,'digit');
  } else {
    keypad.style.gridTemplateRows='repeat(5,1fr)';
    topRow();
    if(kbMode==='digits'){
      pages.digits[0].forEach(k=>addKey(k,k,'digit'));
      addKey('(','(','gray');addKey('0','0','digit');addKey(')',')','gray');
      addKey('.','.','digit');addKey('⌫',null,'orange');addKey('=',null,'blue',true);
      // row of empty to fill 5th
      for(let i=0;i<9;i++) addKey('',null,'digit');
    } else {
      const pg=pages[kbMode][page]||[];
      pg.forEach(k=>{
        if(k==='') addKey('',null,'digit');
        else if(k==='␣') addKey('␣',' ','digit');
        else addKey(caseOf(k),caseOf(k),'digit');
      });
      if(kbMode==='letters') addKey(upper?'A↕':'a↕',null,'teal');
      else addKey('·',null,'digit');
      addKey(page>0?'←':'·',null,page>0?'teal':'digit');
      addKey(page<pages[kbMode].length-1?'→':'·',null,page<pages[kbMode].length-1?'teal':'digit');
      addKey((page+1)+'/'+pages[kbMode].length,null,'digit');
      addKey('⌫',null,'orange');addKey('.','.','digit');addKey('=',null,'blue',true);
    }
  }
}

function addKey(label,value,cls,wide){
  const b=document.createElement('button');
  b.className='key '+cls;b.textContent=label;
  if(label==='⌫') b.onclick=backspace;
  else if(label==='='){if(wide)b.style.gridColumn='span 2';b.onclick=evalExpr}
  else if(label==='a↕'||label==='A↕') b.onclick=()=>{upper=!upper;buildPad()};
  else if(label==='←') b.onclick=()=>{if(page>0){page--;buildPad()}};
  else if(label==='→') b.onclick=()=>{if(page<pages[kbMode].length-1){page++;buildPad()}};
  else if(value!==null&&label!=='') b.onclick=()=>ins(value);
  keypad.appendChild(b);
}

function fracHTML(a,b){
  return '<span style="display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 3px">'+
    '<span style="border-bottom:2px solid #111;padding:0 4px">'+a+'</span><span style="padding:0 4px">'+b+'</span></span>';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}

function render(){
  let out='';
  for(let i=0;i<tokens.length;i++){
    if(tokens[i]==='/'&&i>0&&i<tokens.length-1&&/[0-9]/.test(tokens[i-1])&&/[0-9]/.test(tokens[i+1])){
      out+=fracHTML(esc(tokens[i-1]),esc(tokens[i+1]));i++;
    } else if(tokens[i]==='*') out+=' × ';
    else if(tokens[i]==='-') out+=' − ';
    else out+=esc(tokens[i]);
  }
  document.getElementById('display').textContent=tokens.join(' ');
  document.getElementById('expr').innerHTML=out||'&nbsp;';
}

function ins(t){tokens.push(t);render()}
function backspace(){tokens.pop();render()}

function gcd(a,b){return b?gcd(b,a%b):Math.abs(a)}
function factorial(n){n=Math.floor(Number(n));if(n<0||n>170)return NaN;let r=1;for(let i=2;i<=n;i++)r*=i;return r}

function evalExpr(){
  try{
    let toks=tokens.filter(t=>!/^[a-zA-Zα-ωΑ-Ω]$/.test(t)&&t!==' ');
    if(!toks.length){document.getElementById('result').textContent='= 0';return}
    let src='';
    for(let i=0;i<toks.length;i++){
      const t=toks[i];
      if(t==='√'){
        if(src.length&&/[\d.)]$/.test(src)) src=src.replace(/(\d+\.?\d*|\([^()]*\))$/,'Math.sqrt($1)');
        else{
          src+='Math.sqrt(';let j=i+1,chunk='';
          if(j<toks.length&&(toks[j]==='('||/[\d.]/.test(toks[j]))){
            if(toks[j]==='('){let d=0;while(j<toks.length){chunk+=toks[j];if(toks[j]==='(')d++;if(toks[j]===')'){d--;if(d===0){j++;break}}j++}}
            else while(j<toks.length&&/[\d.]/.test(toks[j])){chunk+=toks[j];j++}
            src+=chunk+')';i=j-1;
          } else src+=')';
        }
      } else if(t==='!') src=src.replace(/(\d+\.?\d*|\([^()]*\))$/,'factorial($1)');
      else if(t==='|'){let j=i+1,chunk='';while(j<toks.length&&toks[j]!=='|'){chunk+=toks[j];j++}src+='Math.abs('+chunk+')';i=j}
      else if(t==='^') src+='**';
      else if(t==='sin'||t==='cos'||t==='tan'||t==='asin'||t==='acos'||t==='atan'||t==='log'||t==='ln'||t==='exp'){
        const fn={sin:'Math.sin',cos:'Math.cos',tan:'Math.tan',asin:'Math.asin',acos:'Math.acos',atan:'Math.atan',
          log:'Math.log10',ln:'Math.log',exp:'Math.exp'}[t];
        src+=fn+'(';
        let j=i+1,chunk='';
        if(j<toks.length&&toks[j]==='('){let d=0;while(j<toks.length){chunk+=toks[j];if(toks[j]==='(')d++;if(toks[j]===')'){d--;if(d===0){j++;break}}j++}src+=chunk.slice(1);i=j-1}
        else{while(j<toks.length&&/[\d.]/.test(toks[j])){chunk+=toks[j];j++}src+=chunk+')';i=j-1}
      }
      else if(t==='π') src+='Math.PI';
      else if(t==='e'&&(i===0||!/[\d.]/.test(toks[i-1]))) src+='Math.E';
      else if(t==='x²') src=src.replace(/(\d+\.?\d*|\([^()]*\))$/,'Math.pow($1,2)');
      else if(t==='x³') src=src.replace(/(\d+\.?\d*|\([^()]*\))$/,'Math.pow($1,3)');
      else if(t==='1/x') src=src.replace(/(\d+\.?\d*|\([^()]*\))$/,'(1/($1))');
      else if(t==='10^') src+='Math.pow(10,';
      else if(t==='±'){if(src.startsWith('-'))src=src.slice(1);else src='-'+src}
      else if(t==='×'||t==='*') src+='*';
      else if(t==='÷'||t==='/') src+='/';
      else if(t==='−') src+='-';
      else src+=t;
    }
    // close unclosed 10^(
    const opens=(src.match(/Math\.pow\(10,/g)||[]).length;
    const closes=(src.match(/\)/g)||[]).length;
    // naive balance for 10^
    if(src.includes('Math.pow(10,')&&!src.trim().endsWith(')')) src+=')';

    const val=Function('"use strict";return ('+src+')')();
    if(typeof val!=='number'||!isFinite(val)){document.getElementById('result').textContent='error';return}
    let text;
    if(Number.isInteger(val)) text=String(val);
    else{
      const sign=val<0?-1:1,av=Math.abs(val);
      let bestN=Math.round(av),bestD=1,bestErr=Math.abs(av-bestN);
      for(let d=1;d<=10000;d++){const n=Math.round(av*d),err=Math.abs(av-n/d);if(err<bestErr){bestErr=err;bestN=n;bestD=d}if(err<1e-12)break}
      if(bestErr<1e-9&&bestD>1) text=(sign*bestN)+'/'+bestD+'  (≈ '+val.toFixed(4)+')';
      else text=parseFloat(val.toPrecision(10)).toString();
    }
    document.getElementById('result').textContent='= '+text;
    history.unshift({expr:tokens.join(''),result:text});
    if(history.length>20) history.pop();
    renderHist();
  }catch(e){document.getElementById('result').textContent='error'}
}

function renderHist(){
  document.getElementById('histList').innerHTML=history.slice(0,8).map(h=>
    '<div>'+esc(h.expr)+' = <b>'+esc(h.result)+'</b></div>').join('');
}

document.getElementById('tipCalc').onclick=()=>{
  const bill=+document.getElementById('tipBill').value,tip=+document.getElementById('tipPct').value,
    tax=+document.getElementById('tipTax').value,split=+document.getElementById('tipSplit').value||1;
  const taxAmt=bill*tax/100, tipAmt=bill*tip/100, total=bill+taxAmt+tipAmt;
  document.getElementById('tipOut').innerHTML='Tip: '+tipAmt.toFixed(2)+'<br>Tax: '+taxAmt.toFixed(2)+
    '<br>Total: '+total.toFixed(2)+'<div class="sub">Per person: '+(total/split).toFixed(2)+'</div>';
};
document.getElementById('loanCalc').onclick=()=>{
  const P=+document.getElementById('loanAmt').value, r=+document.getElementById('loanRate').value/100/12,
    n=+document.getElementById('loanYears').value*12;
  let pay; if(r===0) pay=P/n; else pay=P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
  const total=pay*n, interest=total-P;
  document.getElementById('loanOut').innerHTML='Monthly: '+pay.toFixed(2)+'<br>Total paid: '+total.toFixed(2)+
    '<div class="sub">Total interest: '+interest.toFixed(2)+'</div>';
};
document.getElementById('pctCalc').onclick=()=>{
  const v=+document.getElementById('pctVal').value,p=+document.getElementById('pctPct').value;
  document.getElementById('pctOut').innerHTML=p+'% of '+v+' = '+(v*p/100).toFixed(4)+
    '<div class="sub">'+v+' + '+p+'% = '+(v*(1+p/100)).toFixed(4)+'<br>'+v+' − '+p+'% = '+(v*(1-p/100)).toFixed(4)+'</div>';
};
document.getElementById('upCalc').onclick=()=>{
  const price=+document.getElementById('upPrice').value, qty=+document.getElementById('upQty').value,
    unit=document.getElementById('upUnit').value||'unit';
  document.getElementById('upOut').textContent=(price/qty).toFixed(6)+' per '+unit;
};
document.getElementById('ciCalc').onclick=()=>{
  const P=+document.getElementById('ciP').value, r=+document.getElementById('ciR').value/100,
    t=+document.getElementById('ciT').value, n=+document.getElementById('ciN').value;
  const A=P*Math.pow(1+r/n, n*t), interest=A-P;
  document.getElementById('ciOut').innerHTML='Future value: '+A.toFixed(2)+'<br>Interest earned: '+interest.toFixed(2)+
    '<div class="sub">Effective annual rate: '+((Math.pow(1+r/n,n)-1)*100).toFixed(3)+'%</div>';
};
document.getElementById('savCalc').onclick=()=>{
  const P=+document.getElementById('savP').value, M=+document.getElementById('savM').value,
    r=+document.getElementById('savR').value/100/12, t=+document.getElementById('savT').value*12;
  let fv=P*Math.pow(1+r,t);
  if(r!==0) fv+=M*(Math.pow(1+r,t)-1)/r;
  else fv+=M*t;
  const deposited=P+M*t;
  document.getElementById('savOut').innerHTML='Final balance: '+fv.toFixed(2)+'<br>Total deposited: '+deposited.toFixed(2)+
    '<div class="sub">Interest earned: '+(fv-deposited).toFixed(2)+'</div>';
};
document.getElementById('discCalc').onclick=()=>{
  const p=+document.getElementById('discP').value, pct=+document.getElementById('discPct').value;
  const off=p*pct/100, final=p-off;
  document.getElementById('discOut').innerHTML='You save: '+off.toFixed(2)+'<br>Sale price: '+final.toFixed(2)+
    '<div class="sub">'+pct+'% off '+p.toFixed(2)+'</div>';
};
document.getElementById('vatCalc').onclick=()=>{
  const amt=+document.getElementById('vatAmt').value, pct=+document.getElementById('vatPct').value,
    mode=document.getElementById('vatMode').value;
  if(mode==='add'){
    const tax=amt*pct/100;
    document.getElementById('vatOut').innerHTML='Tax: '+tax.toFixed(2)+'<br>Gross total: '+(amt+tax).toFixed(2)+
      '<div class="sub">Net: '+amt.toFixed(2)+'</div>';
  } else {
    const net=amt/(1+pct/100), tax=amt-net;
    document.getElementById('vatOut').innerHTML='Net: '+net.toFixed(2)+'<br>Tax included: '+tax.toFixed(2)+
      '<div class="sub">Gross: '+amt.toFixed(2)+'</div>';
  }
};
document.getElementById('roiCalc').onclick=()=>{

document.getElementById('marCalc').onclick=()=>{

document.getElementById('quadCalc').onclick=()=>{
  const a=+document.getElementById('qa').value,b=+document.getElementById('qb').value,c=+document.getElementById('qc').value;
  if(a===0){document.getElementById('quadOut').textContent='Not quadratic (a=0)';return}
  const d=b*b-4*a*c;
  if(d<0) document.getElementById('quadOut').innerHTML='Discriminant = '+d.toFixed(4)+'<div class="sub">Complex roots: '+
    ((-b)/(2*a)).toFixed(4)+' ± '+ (Math.sqrt(-d)/(2*a)).toFixed(4)+'i</div>';
  else if(d===0) document.getElementById('quadOut').textContent='One root: '+((-b)/(2*a)).toFixed(6);
  else document.getElementById('quadOut').innerHTML='x₁ = '+((-b+Math.sqrt(d))/(2*a)).toFixed(6)+
    '<br>x₂ = '+((-b-Math.sqrt(d))/(2*a)).toFixed(6);
};
document.getElementById('avgCalc').onclick=()=>{
  const nums=document.getElementById('avgNums').value.split(/[\s,;]+/).map(Number).filter(n=>!isNaN(n));
  if(!nums.length){document.getElementById('avgOut').textContent='No numbers';return}
  const sum=nums.reduce((a,b)=>a+b,0), avg=sum/nums.length;
  const sorted=[...nums].sort((a,b)=>a-b), mid=sorted.length%2?sorted[(sorted.length-1)/2]:(sorted[sorted.length/2-1]+sorted[sorted.length/2])/2;
  const variance=nums.reduce((a,b)=>a+(b-avg)**2,0)/nums.length;
  document.getElementById('avgOut').innerHTML='Count: '+nums.length+'<br>Sum: '+sum+'<br>Average: '+avg.toFixed(6)+
    '<br>Median: '+mid+'<div class="sub">Min: '+Math.min(...nums)+'  Max: '+Math.max(...nums)+'  StdDev: '+Math.sqrt(variance).toFixed(4)+'</div>';
};
document.getElementById('propCalc').onclick=()=>{
  let a=document.getElementById('pa').value,b=document.getElementById('pb').value,
    c=document.getElementById('pc').value,d=document.getElementById('pd').value;
  const empty=[a,b,c,d].filter(x=>x===''||x===null).length;
  if(empty!==1){document.getElementById('propOut').textContent='Leave exactly one field blank';return}
  a=+a;b=+b;c=+c;d=+d;
  let res,label;
  if(document.getElementById('pa').value===''){res=b*c/d;label='a'}
  else if(document.getElementById('pb').value===''){res=a*d/c;label='b'}
  else if(document.getElementById('pc').value===''){res=a*d/b;label='c'}
  else{res=b*c/a;label='d'}
  document.getElementById('propOut').textContent=label+' = '+parseFloat(res.toPrecision(10));
};
document.getElementById('shapeType').onchange=function(){
  const v=this.value;
  const map={rect:['Length','Width',null],circle:['Radius',null,null],tri:['Base','Height',null],
    sphere:['Radius',null,null],cyl:['Radius','Height',null],box:['Length','Width','Height']};
  const m=map[v];
  document.getElementById('s1l').textContent=m[0];document.getElementById('s1g').style.display='block';
  document.getElementById('s2g').style.display=m[1]?'block':'none';if(m[1])document.getElementById('s2l').textContent=m[1];
  document.getElementById('s3g').style.display=m[2]?'block':'none';if(m[2])document.getElementById('s3l').textContent=m[2];
};
document.getElementById('shapeCalc').onclick=()=>{
  const t=document.getElementById('shapeType').value,a=+document.getElementById('s1').value,
    b=+document.getElementById('s2').value,c=+document.getElementById('s3').value;
  let r;
  if(t==='rect') r=a*b;
  else if(t==='circle') r=Math.PI*a*a;
  else if(t==='tri') r=0.5*a*b;
  else if(t==='sphere') r=4/3*Math.PI*a*a*a;
  else if(t==='cyl') r=Math.PI*a*a*b;
  else if(t==='box') r=a*b*c;
  document.getElementById('shapeOut').textContent=parseFloat(r.toPrecision(10));
};

document.getElementById('dateCalc').onclick=()=>{
  const d1=new Date(document.getElementById('d1').value),d2=new Date(document.getElementById('d2').value);
  if(isNaN(d1)||isNaN(d2)){document.getElementById('dateOut').textContent='Invalid dates';return}
  const ms=Math.abs(d2-d1),days=Math.floor(ms/86400000);
  let years=d2.getFullYear()-d1.getFullYear(),m=d2.getMonth()-d1.getMonth(),day=d2.getDate()-d1.getDate();
  if(day<0){m--;day+=new Date(d2.getFullYear(),d2.getMonth(),0).getDate()}
  if(m<0){years--;m+=12}
  document.getElementById('dateOut').innerHTML=years+' years, '+m+' months, '+day+' days'+
    '<div class="sub">Total days: '+days+'</div>';
};
