<!-- Digit-mode keypad template -->
<template id="origKeypad">
  <button class="keyins('%')">%</button>
  <button class="key blue" onclick="ins('!')">n!</button>
  <button class="key blue" onclick="ins('|')">|x|</button>
  <button class="key blue" onclick="ins('^')">xʸ</button>

  <button class="key teal" onclick="ins('a')">a-Z</button>
  <button class="key digit" onclick="ins('0')">0</button>
  <button class="key digit" onclick="ins('.')">.</button>
  <button class="key gray" onclick="ins('(')">(</button>="key gray" onclick="ins(')')">)</button>
  <button class="key orange" onclick="backspace()">⌫</button>
  <button class="key orange" onclick="evalExpr()" style="grid-column:span 3; background:#5b97dfff;">=</button>
</template>

<script>
let tokens = [];
let vars = {};            // stored variable values, e.g. { x: 5, α: 3.14 }
let mode = 'digits';

const LATIN = 'abcdefghijklmnopqrstuvwxyz'.split('');
const GREEK = 'αβγδεζηθικλμνξοπρστυφχψω'.split('');

/* ---------- Keypad building ---------- */

function setMode(m, chip) {
  mode = m;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  buildKeypad();
}

function buildKeypad() {
  const kp = document.getElementById('keypad');
  kp.innerHTML = '';

  if (mode === 'digits') {
    kp.appendChild(document.getElementById('origKeypad').content.cloneNode(true));
    return;
  }

  const letters = mode === 'latin' ? LATIN : GREEK;
  const keys = [];

  // utility row first
  keys.push({ label: '(', val: '(',  cls: 'gray' });
  keys.push({ label: ')', val: ')',  cls: 'gray' });
  keys.push({ label: '+', val: '+',  cls: 'gray' });
  keys.push({ label: '−', val: '-',  cls: 'gray' });
  keys.push({ label: '×', val: '*',  cls: 'gray' });
  keys.push({ label: '÷', val: '/',  cls: 'gray' });
  keys.push({ label: '.', val: '.',  cls: 'digit' });
  keys.push({ label: '=', val: '=',  cls: 'orange' });   // assignment
  keys.push({ label: '⌫', val: null, cls: 'orange', action: backspace });

  // letters
  letters.forEach(L => keys.push({ label: L, val: L, cls' }));

  // equals + clear, pad to full rows of 9
  keys.push({ label: '=', val: null, cls: '', action: evalExpr, span: 3, bg: '#5b97d1', fg: '#fff' });
  keys.push({ label: 'C', val: null, cls: ' clearAll });
  while (keys.length % 9 !== 0) keys.push({ label: '', val: null, cls: 'digit', disabled: true });

  keys.forEach(k => {
    const b = document.createElement('button');
    b.className = 'key ' + k.cls;
    b.textContent = k.label;
    if (k.disabled) b.disabled = true;
    if (k.bg) { b.style.background = k.bg; b.style.color = k.fg; }
    if (k.span) b.style.gridColumn = 'span ' + k.span;
    if (k.action) b.onclick = k.action;
    else if (k.val !== null) b.onclick = () => ins(k.val);
    kp.appendChild(b);
  });
}

/* ---------- Input & rendering ---------- */

function fracHTML(a, b) {
  return '<span style="display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 3px">' +
         '<span style="border-bottom:2px solid #111;padding:0 4px">' + a + '</span>' +
         '<span style="padding:0 4px">' + b + '</span></span>';
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function render() {
  let out = '';
  const disp = [];
  for (let i = 0; i < tokens.length; i++) {
    if (tokens[i] === '/' && i > 0 && i < tokens.length - 1) {
      // gather full left operand = '', j = i - 1;
      while (j >= 0 && /[0-9.]/.test(tokens[j])) { a = tokens[j] + a; j--; }
      // gather full right operand
      let b = '', k = i + 1;
      while (k < tokens.length && /[0-9.]/.test(tokens[k])) { b += tokens[k]; k++; }
      if (a && b) {
        out += fracHTML(esc(a), esc(b));
        disp.push(a + '/' + b);
        i = k - 1;
        continue;
      }
    }
    if (tokens[i] === '*') { out += ' × '; disp.push('*'); }
    else if (tokens[i] === '-') { out += ' − '; disp.push('-'); }
    else if (/[a-zα-ω]/.test(tokens[i])) {
      const defined = tokens[i] in vars;
      out += '<span style="color:' + (defined ? '#1a6b7a' : '#c0392b') +
             ';font-weight:700">' + esc(tokens[i]) + '</span>';
      disp.push(tokens[i]);
    }
    else { out += esc(tokens[i]); disp.push(tokens[i]); }
  }
  document.getElementById('display').textContent = disp.join('');
  document.getElementById('expr').innerHTML = out || '&nbsp;';
}

function ins(t){ tokens.push(t); render(); }
function backspace(){ tokens.pop(); render(); }
function = []; document.getElementById('result').textContent = ''; render(); }

/* ---------- Math evaluation ---------- */

function gcd(a, b){ return b ? gcd(b, a % b) : Math.abs(a); }

function fmt(val) {
  if (Number.isInteger(val)) return String(val);
  const s = String(val);
  const m = s.match(/^(-?\d+)\.(\d+)$/);
  if (m) {
    const num = parseInt(m[1] + m[2]), den = Math.pow(10, m[2].length);
    const g = gcd(num, den);
    return (num/g) + '/' + (den/g) + '  (≈ ' + val.toFixed(4) + ')';
  }
  return val.toFixed(6);
}

function evalSubst(s) {
  // π constant
  s = s.replace(/π/g, '(3.141592653589793)');
  // substitute variables; undefined ones throw
  s = s.replace(/[a-zα-ω]+/g, name => {
    if (!(name in vars)) throw new Error('undefined variable: ' + name);
    return '(' + vars[name] + ')';
  });
  // supported math symbols
  s = s.replace(/√/g, 'Math.sqrt').replace(/\^/g, '**');

  // whitelist check — nothing but numbers, operators, parens, Math.sqrt
  if (/[^0-9+\-*/().%\sM]/.test(s.replace(/Math\.sqrt/g, 'M'))) throw new Error('bad token');

  return Function('"use + s + ')')();
}

function evalExpr() {
  try {
    const s = tokens.join('');

    // assignment: "x=5" or "α=2+3"
    const eq = s.indexOf('=');
    if (eq > 0 && /^[a-zα-ω]+$/.test(s.slice(0, eq).trim())) {
      const name = s.slice(0, eq).trim();
      const body = s.slice(eq + 1);
      vars[name] = evalSubst(body);
      document.getElementById('result').textContent = name + ' = ' + fmt(vars[name]);
      render();
      return;
    }

    const val = evalSubst(s);
    document.getElementById('result').textContent = '= ' + fmt(val);
  } catch (e) {
    document.getElementById('result').textContent = 'error';
  }
}

/* ---------- init ---------- */
buildKeypad
